robot_kinematics:
  ros__parameters:
    base_frame: base_link
    gripper_joint_name: gripper

    joint_state_topic: /so101/joint_states
    cartesian_command_topic: /so101/cartesian_command
    policy_action_topic: /so101/policy_action
    end_effector_pose_topic: /so101/end_effector_pose
    
    ik:
      maximum_iterations: 100

      position_tolerance: 0.001
      orientation_tolerance: 0.05

      position_weight: 1.0
      orientation_weight: 0.10

      damping: 0.001
      continuity_weight: 0.001
      maximum_joint_step: 0.05
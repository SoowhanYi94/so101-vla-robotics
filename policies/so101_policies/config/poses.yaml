relative_to_initial: true

transition_duration_seconds: 4.0
hold_duration_seconds: 1.5
publish_rate_hz: 60.0

poses:
  home:
    shoulder_pan: 0.0
    shoulder_lift: 0.0
    elbow_flex: 0.0
    wrist_flex: 0.0
    wrist_roll: 0.0
    gripper: 0.0

  pre_grasp:
    shoulder_pan: 0.0
    shoulder_lift: -0.08
    elbow_flex: 0.12
    wrist_flex: -0.06
    wrist_roll: 0.0
    gripper: 0.20

sequence:
  - home
  - pre_grasp
  - home